spring:
  application:
    name: orders
  datasource:
    url: jdbc:postgresql://localhost:5555/order_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

ecommerce:
  orders:
    clients:
      products:
        url: http://localhost:8081/api/products

      customers:
        url: http://localhost:8082/api/customers
  config:
    kafka:
      server-url: "http://localhost:29092"
      topics:
        paid-orders: "ecommerce.paid-orders"
        orders-shipped: "ecommerce.orders-shipped"
        invoiced-orders: "ecommerce.invoiced-orders"
